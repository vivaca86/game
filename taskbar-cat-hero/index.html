<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskbar Cat Restaurant Hero</title>
    <link rel="stylesheet" href="./styles.css?v=31" />
    <link rel="stylesheet" href="./taskbar-companion.css?v=14" />
  </head>
  <body>
    <main class="desktop" aria-label="Taskbar Cat Restaurant Hero">
      <section class="game-panel" id="gamePanel" aria-label="확장 관리창">
        <header class="topbar">
          <nav class="tabs" aria-label="게임 메뉴">
            <button class="tab active" data-view="cat" aria-label="고양이"><span class="ui-symbol ui-symbol--paw"></span></button>
            <button class="tab" data-view="kitchen" aria-label="주방"><span class="ui-symbol ui-symbol--chef"></span></button>
            <button class="tab" data-view="recipe" aria-label="레시피"><span class="ui-symbol ui-symbol--utensil"></span></button>
            <button class="tab" data-view="farm" aria-label="생산"><span class="ui-symbol ui-symbol--sprout"></span></button>
            <button class="tab" data-view="dispatch" aria-label="파견"><span class="ui-symbol ui-symbol--cottage"></span></button>
            <button class="tab" data-view="collection" aria-label="컬렉션"><span class="ui-symbol ui-symbol--star"></span></button>
          </nav>
          <div class="resources" aria-live="polite">
            <span><i class="ui-symbol ui-symbol--heart"></i><b id="heartValue">0</b></span>
            <span><i class="ui-symbol ui-symbol--coin"></i><b id="coinValue">0</b></span>
            <span><i class="ui-symbol ui-symbol--gem"></i><b id="gemValue">0</b></span>
            <span><i class="ui-symbol ui-symbol--bolt"></i><b id="energyValue">0</b>/50</span>
            <span><i class="ui-symbol ui-symbol--cat"></i><b id="catValue">1</b>/40</span>
          </div>
          <div class="window-actions">
            <button id="saveButton" aria-label="저장"><span class="ui-symbol ui-symbol--save"></span></button>
            <button id="resetButton" aria-label="초기화"><span class="ui-symbol ui-symbol--reset"></span></button>
            <button id="collapseButton" aria-label="접기"><span class="ui-symbol ui-symbol--close"></span></button>
          </div>
        </header>

        <div class="panel-grid">
          <aside class="cat-panel card" aria-label="고양이 상태">
            <div class="gear-column left">
              <button class="gear selected" data-gear="spatula" aria-label="뒤집개"><span class="menu-icon menu-icon--spatula"></span><small>Lv.<b id="gear-spatula">1</b></small></button>
              <button class="gear" data-gear="coat" aria-label="요리사 코트"><span class="menu-icon menu-icon--coat"></span><small>Lv.<b id="gear-coat">1</b></small></button>
              <button class="gear" data-gear="bag" aria-label="가방"><span class="menu-icon menu-icon--bag"></span><small>Lv.<b id="gear-bag">1</b></small></button>
            </div>
            <div class="cat-card">
              <div class="stars" id="catStars">★★★☆☆</div>
              <div class="big-cat chef" aria-hidden="true">
                <div class="cat-ear left"></div>
                <div class="cat-ear right"></div>
                <div class="cat-face">
                  <span class="eye left"></span>
                  <span class="eye right"></span>
                  <span class="mouth"></span>
                </div>
                <div class="chef-hat"></div>
                <div class="scarf"></div>
                <div class="spatula"></div>
              </div>
            </div>
            <div class="gear-column right">
              <button class="gear" data-gear="pan" aria-label="냄비"><span class="menu-icon menu-icon--pot"></span><small>Lv.<b id="gear-pan">1</b></small></button>
              <button class="gear" data-gear="apron" aria-label="앞치마"><span class="menu-icon menu-icon--apron"></span><small>Lv.<b id="gear-apron">1</b></small></button>
              <button class="gear" data-gear="recipeBook" aria-label="레시피 북"><span class="menu-icon menu-icon--book"></span><small>Lv.<b id="gear-recipeBook">1</b></small></button>
            </div>
            <div class="stat-list">
              <div class="stat"><span class="ui-symbol ui-symbol--heart"></span><div><i id="affectionBar"></i></div><b id="affectionText">0</b></div>
              <div class="stat"><span class="ui-symbol ui-symbol--bolt"></span><div><i id="energyBar"></i></div><b id="focusText">0</b></div>
              <div class="stat"><span class="ui-symbol ui-symbol--star"></span><div><i id="skillBar"></i></div><b id="skillText">0</b></div>
            </div>
            <div class="party-list" id="partyList" aria-label="고양이 파티"></div>
          </aside>

          <section class="restaurant card" aria-label="식당">
            <div class="room">
              <div class="activity-note" id="activityNote">냄비를 젓는 중...</div>
            </div>
            <div class="scene-actions">
              <button id="cookButton"><span class="menu-icon menu-icon--stew"></span>요리</button>
              <button id="decorateButton"><span class="menu-icon menu-icon--chair"></span>배치</button>
              <button id="collectButton"><span class="ui-symbol ui-symbol--sprout"></span>수확</button>
            </div>
          </section>

          <aside class="recipe-panel card" aria-label="레시피와 재료">
            <div class="recipe-tabs">
              <button class="active" aria-label="요리"><span class="ui-symbol ui-symbol--chef"></span></button>
              <button aria-label="냄비"><span class="menu-icon menu-icon--pot"></span></button>
              <button aria-label="디저트"><span class="menu-icon menu-icon--cake"></span></button>
              <button aria-label="재료"><span class="ui-symbol ui-symbol--sprout"></span></button>
              <button aria-label="선물"><span class="menu-icon menu-icon--gift"></span></button>
            </div>
            <div class="recipe-grid" id="recipeGrid"></div>
            <div class="ingredient-row" id="ingredientRow"></div>
            <button class="upgrade-button" id="upgradeSelected">UP</button>
          </aside>

          <section class="production card" aria-label="생산과 파견">
            <div class="production-list" id="productionList"></div>
            <div class="route-map">
              <button class="node active" data-dispatch="garden" aria-label="허브 정원"><span class="ui-symbol ui-symbol--cat"></span></button>
              <button class="node locked" data-dispatch="market" aria-label="시장 잠김"><span class="ui-symbol ui-symbol--lock"></span></button>
              <button class="node locked" data-dispatch="harbor" aria-label="항구 잠김"><span class="ui-symbol ui-symbol--lock"></span></button>
              <button class="node final" data-dispatch="festival" aria-label="축제"><span class="ui-symbol ui-symbol--heart"></span></button>
            </div>
          </section>
        </div>
      </section>

      <aside
        class="taskbar-companion"
        id="taskbarCompanion"
        data-ambient="alert-idle"
        data-reaction="none"
        data-pose="idle-alert"
        data-motion="full"
        aria-label="작업표시줄 고양이"
      >
        <button
          class="taskbar-cat-hit-target"
          id="tinyWidget"
          type="button"
          aria-controls="gamePanel"
          aria-expanded="false"
          aria-label="고양이 가게 열기"
        >
          <span class="sr-only">고양이 가게 열기</span>
        </button>
        <span class="taskbar-cat-visual" aria-hidden="true">
          <span class="taskbar-cat-reaction-motion">
            <span class="taskbar-cat-ambient-motion">
              <span class="taskbar-cat-pose"></span>
            </span>
          </span>
          <span class="taskbar-cat-fx">
            <i class="taskbar-cat-key-flash taskbar-cat-key-flash--left"></i>
            <i class="taskbar-cat-key-flash taskbar-cat-key-flash--right"></i>
            <i class="taskbar-cat-gesture-fx"></i>
            <span class="taskbar-cat-doze-fx">Z<small>z</small></span>
          </span>
        </span>
      </aside>

      <footer class="os-taskbar" aria-hidden="true">
        <span class="os-icon"></span>
        <span class="os-search"></span>
        <span class="app-icon folder"></span>
        <span class="app-icon browser"></span>
        <span class="app-icon mail"></span>
        <span class="app-icon active-cat"></span>
        <span class="tray">⌃  ▢  )))  ▱  ◔</span>
      </footer>
    </main>
    <script src="./taskbar-widget-core.js?v=10"></script>
    <script src="./app.js?v=44"></script>
  </body>
</html>
