<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Taskbar Cat Restaurant Hero</title>
    <link rel="stylesheet" href="./styles.css?v=28" />
    <link rel="stylesheet" href="./widget-v28.css?v=2" />
  </head>
  <body>
    <main class="desktop" aria-label="Taskbar Cat Restaurant Hero">
      <section class="game-panel" id="gamePanel" aria-label="확장 관리창">
        <header class="topbar">
          <nav class="tabs" aria-label="게임 메뉴">
            <button class="tab active" data-view="cat" aria-label="고양이">🐾</button>
            <button class="tab" data-view="kitchen" aria-label="주방">🍳</button>
            <button class="tab" data-view="recipe" aria-label="레시피">🥄</button>
            <button class="tab" data-view="farm" aria-label="생산">🌿</button>
            <button class="tab" data-view="dispatch" aria-label="파견">🏠</button>
            <button class="tab" data-view="collection" aria-label="컬렉션">⭐</button>
          </nav>
          <div class="resources" aria-live="polite">
            <span>♥ <b id="heartValue">0</b></span>
            <span>🪙 <b id="coinValue">0</b></span>
            <span>💎 <b id="gemValue">0</b></span>
            <span>⚡ <b id="energyValue">0</b>/50</span>
            <span>🐱 <b id="catValue">1</b>/40</span>
          </div>
          <div class="window-actions">
            <button id="saveButton" aria-label="저장">💾</button>
            <button id="resetButton" aria-label="초기화">↺</button>
            <button id="collapseButton" aria-label="접기">×</button>
          </div>
        </header>

        <div class="panel-grid">
          <aside class="cat-panel card" aria-label="고양이 상태">
            <div class="gear-column left">
              <button class="gear selected" data-gear="spatula">🍴<small>Lv.<b id="gear-spatula">1</b></small></button>
              <button class="gear" data-gear="coat">🥼<small>Lv.<b id="gear-coat">1</b></small></button>
              <button class="gear" data-gear="bag">🎒<small>Lv.<b id="gear-bag">1</b></small></button>
            </div>
            <div class="cat-card">
              <div class="stars" id="catStars">★★★☆☆</div>
              <div class="big-cat chef" aria-hidden="true">
                <div class="cat-ear left"></div>
                <div class="cat-ear right"></div>
                <div class="cat-face">
                  <span class="eye left"></span>
                  <span class="eye right"></span>
                  <span class="mouth"></span>
                </div>
                <div class="chef-hat"></div>
                <div class="scarf"></div>
                <div class="spatula"></div>
              </div>
            </div>
            <div class="gear-column right">
              <button class="gear" data-gear="pan">🍲<small>Lv.<b id="gear-pan">1</b></small></button>
              <button class="gear" data-gear="apron">🟩<small>Lv.<b id="gear-apron">1</b></small></button>
              <button class="gear" data-gear="recipeBook">📔<small>Lv.<b id="gear-recipeBook">1</b></small></button>
            </div>
            <div class="stat-list">
              <div class="stat"><span>♥</span><div><i id="affectionBar"></i></div><b id="affectionText">0</b></div>
              <div class="stat"><span>⚡</span><div><i id="energyBar"></i></div><b id="focusText">0</b></div>
              <div class="stat"><span>⭐</span><div><i id="skillBar"></i></div><b id="skillText">0</b></div>
            </div>
            <div class="party-list" id="partyList" aria-label="고양이 파티"></div>
          </aside>

          <section class="restaurant card" aria-label="식당">
            <div class="room">
              <div class="floor"></div>
              <div class="counter back"></div>
              <div class="oven"></div>
              <div class="shelf shelf-a"></div>
              <div class="shelf shelf-b"></div>
              <div class="table t1"><span>🍝</span></div>
              <div class="table t2"><span>🍰</span></div>
              <div class="table t3"><span>🥘</span></div>
              <div class="room-cat c1"></div>
              <div class="room-cat c2"></div>
              <div class="room-cat c3"></div>
              <div class="bubble b1">🍝</div>
              <div class="bubble b2">♥</div>
              <div class="bubble b3">🍰</div>
              <div class="activity-note" id="activityNote">냄비를 젓는 중...</div>
            </div>
            <div class="scene-actions">
              <button id="cookButton">🍳 요리</button>
              <button id="decorateButton">🪑 배치</button>
              <button id="collectButton">🌿 수확</button>
            </div>
          </section>

          <aside class="recipe-panel card" aria-label="레시피와 재료">
            <div class="recipe-tabs">
              <button class="active">🍳</button>
              <button>🍲</button>
              <button>🍰</button>
              <button>🌿</button>
              <button>🎁</button>
            </div>
            <div class="recipe-grid" id="recipeGrid"></div>
            <div class="ingredient-row" id="ingredientRow"></div>
            <button class="upgrade-button" id="upgradeSelected">UP</button>
          </aside>

          <section class="production card" aria-label="생산과 파견">
            <div class="production-list" id="productionList"></div>
            <div class="route-map">
              <button class="node active" data-dispatch="garden">🐱</button>
              <button class="node locked" data-dispatch="market">🔒</button>
              <button class="node locked" data-dispatch="harbor">🔒</button>
              <button class="node final" data-dispatch="festival">♥</button>
            </div>
          </section>
        </div>
      </section>

      <button class="tiny-widget" id="tinyWidget" aria-label="작은 상주 위젯 열기">
        <span class="mini-scene">
          <svg class="widget-stage" viewBox="0 0 178 78" aria-hidden="true" focusable="false">
            <defs>
              <linearGradient id="widgetWood" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#d99b52" />
                <stop offset="1" stop-color="#7d4727" />
              </linearGradient>
              <linearGradient id="widgetFur" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#fffaf0" />
                <stop offset="1" stop-color="#f3dcc0" />
              </linearGradient>
              <linearGradient id="widgetPot" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#f0f5f4" />
                <stop offset="0.5" stop-color="#9aa7aa" />
                <stop offset="1" stop-color="#566267" />
              </linearGradient>
              <linearGradient id="widgetLeaf" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#b9e66e" />
                <stop offset="1" stop-color="#438a39" />
              </linearGradient>
            </defs>
            <ellipse class="widget-ground" cx="82" cy="69" rx="76" ry="8" />
            <g class="widget-shelf">
              <path d="M67 16h55l4 5H63z" />
              <rect x="68" y="8" width="7" height="12" rx="2" />
              <rect x="79" y="10" width="6" height="10" rx="2" />
              <rect x="89" y="7" width="8" height="13" rx="2" />
              <rect x="101" y="11" width="6" height="9" rx="2" />
              <rect x="112" y="8" width="7" height="12" rx="2" />
            </g>
            <g class="widget-base">
              <rect x="19" y="62" width="127" height="9" rx="4" />
              <path d="M24 61h116c6 0 9 2 10 5H15c1-3 4-5 9-5z" />
            </g>
            <g class="widget-cat">
              <path class="cat-tail" d="M27 50c-14 0-15-22-4-22 8 0 6 11 1 13 5 4 12 3 15-1" />
              <ellipse class="cat-body" cx="48" cy="52" rx="19" ry="19" />
              <path class="cat-apron" d="M36 41h24v22c-6 4-17 4-24 0z" />
              <path class="cat-scarf" d="M32 40c8 6 23 6 31 0l-2 7c-8 3-19 3-27 0z" />
              <path class="cat-ear" d="M29 25 35 8l8 17z" />
              <path class="cat-ear" d="M58 25 70 10l0 19z" />
              <ellipse class="cat-head" cx="48" cy="30" rx="27" ry="23" />
              <path class="cat-hat" d="M34 14c1-8 12-10 16-4 4-6 15-3 15 5 4 0 7 4 5 8H31c-4-4-1-9 3-9z" />
              <rect class="cat-hat-band" x="35" y="20" width="29" height="9" rx="2" />
              <g class="cat-face">
                <line class="cat-eye left" x1="36" y1="31" x2="43" y2="31" />
                <line class="cat-eye right" x1="54" y1="31" x2="61" y2="31" />
                <ellipse class="cat-blush left" cx="35" cy="37" rx="4" ry="1.4" />
                <ellipse class="cat-blush right" cx="61" cy="37" rx="4" ry="1.4" />
                <path class="cat-mouth" d="M48 35c2 2 4 2 5 0M48 35c-2 2-4 2-5 0" />
                <line class="cat-whisker" x1="30" y1="35" x2="40" y2="33" />
                <line class="cat-whisker" x1="30" y1="39" x2="40" y2="38" />
                <line class="cat-whisker" x1="66" y1="35" x2="56" y2="33" />
                <line class="cat-whisker" x1="66" y1="39" x2="56" y2="38" />
              </g>
              <g class="cat-stir cat-stir-hidden">
                <ellipse class="cat-paw" cx="64" cy="49" rx="7" ry="6" />
                <path class="cat-spoon" d="M67 47 94 34" />
                <ellipse class="cat-spoon-tip" cx="97" cy="32" rx="5" ry="4" />
              </g>
            </g>
            <g class="widget-pot">
              <ellipse class="pot-rim" cx="91" cy="47" rx="23" ry="8" />
              <path class="pot-body" d="M68 47h46l-5 18H73z" />
              <path class="pot-handle left" d="M69 51c-10-5-13 6-4 8" />
              <path class="pot-handle right" d="M113 51c10-5 13 6 4 8" />
              <ellipse class="soup" cx="91" cy="46" rx="18" ry="5" />
              <circle class="soup-bubble b1" cx="85" cy="45" r="1.6" />
              <circle class="soup-bubble b2" cx="98" cy="46" r="1.2" />
            </g>
            <g class="cat-stir cat-stir-front">
              <ellipse class="cat-paw" cx="63" cy="49" rx="7" ry="6" />
              <path class="cat-spoon" d="M66 47 92 42" />
              <ellipse class="cat-spoon-tip" cx="93" cy="42" rx="4" ry="3" />
            </g>
            <g class="widget-steam">
              <path class="steam s1" d="M83 35c-6-5 5-8 0-13" />
              <path class="steam s2" d="M93 34c-6-5 5-8 0-13" />
              <path class="steam s3" d="M103 35c-5-4 4-7 0-11" />
            </g>
            <g class="widget-herb">
              <path class="herb-pot" d="M123 50h31l-4 16h-23z" />
              <path class="leaf l1" d="M137 47c-8-8-1-15 4-8 2 4 0 7-4 8z" />
              <path class="leaf l2" d="M143 48c4-12 14-9 11 0-2 5-7 5-11 0z" />
              <path class="leaf l3" d="M132 51c-12-3-9-13-1-11 5 1 5 7 1 11z" />
              <path class="leaf l4" d="M149 54c8-7 15 1 8 6-4 3-8 1-8-6z" />
              <path class="leaf l5" d="M138 55c-3-10 6-13 9-5 2 5-3 7-9 5z" />
            </g>
          </svg>
        </span>
        <span class="mini-timer" id="miniTimer">00:30</span>
        <span class="mini-expand">↗</span>
      </button>

      <footer class="os-taskbar" aria-hidden="true">
        <span class="os-icon"></span>
        <span class="os-search"></span>
        <span class="app-icon folder"></span>
        <span class="app-icon browser"></span>
        <span class="app-icon mail"></span>
        <span class="app-icon active-cat"></span>
        <span class="tray">⌃  ▢  )))  ▱  ◔</span>
      </footer>
    </main>
    <script src="./app.js?v=28"></script>
  </body>
</html>
