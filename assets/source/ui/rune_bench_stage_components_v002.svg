<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect width="1600" height="900" fill="#fff8e8"/>
  <rect x="90" y="86" width="1420" height="720" fill="#f9e7bd" stroke="#b98c34" stroke-width="6" opacity="0.55"/>
  <rect x="486" y="60" width="628" height="106" rx="16" fill="#fff6df" stroke="#5a4638" stroke-width="8"/>
  <text x="800" y="114" text-anchor="middle" font-family="serif" font-size="42" font-weight="700" fill="#1e2a3e">RuneBench v002 source sheet</text>
  <text x="800" y="150" text-anchor="middle" font-family="serif" font-size="20" fill="#805845">state-driven socket preview, before-after impact, compatibility proof</text>

  <g transform="translate(150 250)">
    <rect width="350" height="420" rx="14" fill="#fff6df" stroke="#5a4638" stroke-width="8"/>
    <text x="34" y="56" font-family="serif" font-size="34" font-weight="700" fill="#32415a">Rune inventory</text>
    <text x="34" y="92" font-family="serif" font-size="18" fill="#805845">selected rune and socket type</text>
    <rect x="40" y="128" width="270" height="62" rx="8" fill="#f7e1a2" stroke="#d7ba6a" stroke-width="5"/>
    <circle cx="76" cy="159" r="22" fill="#ce5869" stroke="#fff3b0" stroke-width="4"/>
    <text x="112" y="153" font-family="serif" font-size="20" font-weight="700" fill="#1e2a3e">selected rune</text>
    <text x="112" y="178" font-family="serif" font-size="16" fill="#805845">socket / rarity</text>
    <rect x="40" y="330" width="270" height="66" fill="#fffaf0" stroke="#c6a65e" stroke-width="3"/>
    <text x="60" y="360" font-family="serif" font-size="18" fill="#805845">confirm equips the selected rune</text>
    <text x="60" y="384" font-family="serif" font-size="18" fill="#805845">to the first compatible card</text>
  </g>

  <g transform="translate(545 235)">
    <rect width="510" height="450" rx="14" fill="#fffaf0" stroke="#5a4638" stroke-width="8"/>
    <text x="38" y="60" font-family="serif" font-size="34" font-weight="700" fill="#32415a">Socket workbench</text>
    <text x="38" y="100" font-family="serif" font-size="24" font-weight="700" fill="#1e2a3e">selected rune name</text>
    <rect x="96" y="144" width="150" height="218" fill="#fffbed" stroke="#8d6a2a" stroke-width="6"/>
    <text x="171" y="178" text-anchor="middle" font-family="serif" font-size="18" fill="#1e2a3e">target card</text>
    <text x="171" y="326" text-anchor="middle" font-family="serif" font-size="18" fill="#805845">card preview</text>
    <line x1="255" y1="246" x2="376" y2="246" stroke="#8d6a2a" stroke-width="7"/>
    <circle cx="304" cy="246" r="18" fill="#f5c26b" stroke="#fff3b0" stroke-width="4"/>
    <circle cx="418" cy="246" r="74" fill="#ce5869" stroke="#fff3b0" stroke-width="7"/>
    <text x="418" y="334" text-anchor="middle" font-family="serif" font-size="20" fill="#805845">rune stone</text>
    <rect x="264" y="142" width="158" height="76" fill="#fff6df" stroke="#c6a65e" stroke-width="4"/>
    <text x="284" y="168" font-family="serif" font-size="16" fill="#805845">before</text>
    <text x="284" y="194" font-family="serif" font-size="19" font-weight="700" fill="#1e2a3e">cost / dmg / block</text>
    <rect x="264" y="256" width="158" height="76" fill="#fff6df" stroke="#f5c26b" stroke-width="5"/>
    <text x="284" y="282" font-family="serif" font-size="16" fill="#1f8a70">after</text>
    <text x="284" y="308" font-family="serif" font-size="19" font-weight="700" fill="#1e2a3e">changed values</text>
    <rect x="120" y="386" width="330" height="50" fill="#fff6df" stroke="#c6a65e" stroke-width="4"/>
    <text x="142" y="418" font-family="serif" font-size="19" fill="#805845">compatibility proof band</text>
  </g>

  <g transform="translate(1100 250)">
    <rect width="350" height="420" rx="14" fill="#fff6df" stroke="#5a4638" stroke-width="8"/>
    <text x="34" y="56" font-family="serif" font-size="34" font-weight="700" fill="#32415a">Tuning ledger</text>
    <text x="34" y="92" font-family="serif" font-size="18" fill="#805845">owned, equipped, socket, target, change</text>
    <g font-family="serif" font-size="19" fill="#1e2a3e">
      <rect x="40" y="126" width="270" height="46" rx="8" fill="#f7e1a2" stroke="#d7ba6a" stroke-width="4"/>
      <text x="62" y="156">owned</text><text x="190" y="156">1</text>
      <rect x="40" y="186" width="270" height="46" rx="8" fill="#f7e1a2" stroke="#d7ba6a" stroke-width="4"/>
      <text x="62" y="216">equipped</text><text x="190" y="216">0</text>
      <rect x="40" y="246" width="270" height="46" rx="8" fill="#f7e1a2" stroke="#d7ba6a" stroke-width="4"/>
      <text x="62" y="276">socket</text><text x="190" y="276">attack</text>
      <rect x="40" y="306" width="270" height="46" rx="8" fill="#f7e1a2" stroke="#d7ba6a" stroke-width="4"/>
      <text x="62" y="336">change</text><text x="190" y="336">8 -> 10</text>
    </g>
    <rect x="40" y="366" width="270" height="36" fill="#fffaf0" stroke="#c6a65e" stroke-width="3"/>
    <text x="62" y="390" font-family="serif" font-size="17" fill="#805845">recommendation / warning line</text>
  </g>
</svg>
