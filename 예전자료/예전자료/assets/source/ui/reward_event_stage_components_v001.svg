<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Reward and Event paper theater UI source components v001</title>
  <desc id="desc">Source component sheet for popup-book reward cards, event choices, paper stage ribbons, pins, folds, and diorama panels.</desc>
  <defs>
    <filter id="paperShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="6" flood-color="#1e2a3e" flood-opacity="0.22"/>
    </filter>
    <pattern id="paperGrain" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#fff7e3"/>
      <path d="M0 3h16M2 9h12M0 14h16" stroke="#c6a65e" stroke-width="0.7" opacity="0.16"/>
    </pattern>
    <linearGradient id="warmPaper" x1="0" x2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="0.55" stop-color="#f8efd8"/>
      <stop offset="1" stop-color="#efe0bf"/>
    </linearGradient>
    <linearGradient id="tealRibbon" x1="0" x2="1">
      <stop offset="0" stop-color="#2f6b68"/>
      <stop offset="1" stop-color="#47847a"/>
    </linearGradient>
    <linearGradient id="coralRibbon" x1="0" x2="1">
      <stop offset="0" stop-color="#a5483f"/>
      <stop offset="1" stop-color="#c45e52"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="#f5e7ca"/>
  <rect x="0" y="0" width="1600" height="900" fill="url(#paperGrain)" opacity="0.72"/>

  <g id="stage-frame" filter="url(#paperShadow)">
    <rect x="110" y="90" width="1380" height="690" rx="20" fill="url(#warmPaper)" stroke="#574032" stroke-width="12"/>
    <rect x="150" y="130" width="1300" height="610" rx="8" fill="none" stroke="#c6a65e" stroke-width="5" opacity="0.72"/>
    <ellipse cx="800" cy="405" rx="520" ry="205" fill="#2f6b68" opacity="0.12"/>
    <ellipse cx="800" cy="430" rx="390" ry="150" fill="#a5483f" opacity="0.08"/>
  </g>

  <g id="stage-ribbons">
    <path d="M250 160h1100v78H250z" fill="url(#coralRibbon)" stroke="#f5c26b" stroke-width="4"/>
    <path d="M250 160l-100 39 100 39z" fill="#a5483f" stroke="#f5c26b" stroke-width="4"/>
    <path d="M1350 160l100 39-100 39z" fill="#a5483f" stroke="#f5c26b" stroke-width="4"/>
    <path d="M250 280h1100v78H250z" fill="url(#tealRibbon)" stroke="#f5c26b" stroke-width="4"/>
    <path d="M250 280l-100 39 100 39z" fill="#2f6b68" stroke="#f5c26b" stroke-width="4"/>
    <path d="M1350 280l100 39-100 39z" fill="#2f6b68" stroke="#f5c26b" stroke-width="4"/>
  </g>

  <g id="pins-and-threads">
    <path d="M390 82v140M800 82v140M1210 82v140" stroke="#805845" stroke-width="4" opacity="0.46"/>
    <g fill="#f5c26b" stroke="#6d4a20" stroke-width="4">
      <circle cx="390" cy="160" r="18"/>
      <circle cx="800" cy="160" r="18"/>
      <circle cx="1210" cy="160" r="18"/>
      <circle cx="150" cy="130" r="16"/>
      <circle cx="1450" cy="130" r="16"/>
      <circle cx="150" cy="740" r="16"/>
      <circle cx="1450" cy="740" r="16"/>
    </g>
    <g fill="#fff3b0" opacity="0.82">
      <circle cx="384" cy="154" r="5"/>
      <circle cx="794" cy="154" r="5"/>
      <circle cx="1204" cy="154" r="5"/>
    </g>
  </g>

  <g id="reward-card-source" transform="translate(200 430)" filter="url(#paperShadow)">
    <rect width="300" height="390" rx="16" fill="#fff8e8" stroke="#574032" stroke-width="8"/>
    <rect x="14" y="16" width="272" height="56" fill="#a5483f" opacity="0.92"/>
    <circle cx="150" cy="48" r="32" fill="#fff1d0" stroke="#a5483f" stroke-width="4"/>
    <rect x="32" y="100" width="236" height="138" rx="10" fill="#f9efd2" stroke="#574032" stroke-width="4"/>
    <path d="M210 72h58v58zM32 330h58v58H32z" fill="#f7dfae" opacity="0.82"/>
    <rect x="32" y="264" width="236" height="46" fill="#f7e4bd" opacity="0.55"/>
    <rect x="32" y="326" width="236" height="42" fill="#f3dcc1" stroke="#a5483f" stroke-width="2" opacity="0.7"/>
  </g>

  <g id="event-choice-source" transform="translate(560 560)" filter="url(#paperShadow)">
    <rect width="450" height="190" rx="14" fill="#fff8e8" stroke="#574032" stroke-width="7"/>
    <circle cx="44" cy="42" r="27" fill="#fff1d0" stroke="#2f6b68" stroke-width="4"/>
    <path d="M386 0h64v64z" fill="#e2b86b" opacity="0.86"/>
    <rect x="80" y="28" width="318" height="30" fill="#2f6b68" opacity="0.18"/>
    <rect x="36" y="126" width="160" height="26" fill="#f7e4bd" opacity="0.7"/>
    <rect x="36" y="158" width="260" height="22" fill="#f7e4bd" opacity="0.5"/>
  </g>

  <g id="event-diorama-source" transform="translate(560 390)" filter="url(#paperShadow)">
    <rect width="680" height="150" rx="12" fill="#fff8e8" stroke="#574032" stroke-width="7"/>
    <rect x="22" y="22" width="220" height="106" fill="#e4dcc4" stroke="#b98c34" stroke-width="4"/>
    <ellipse cx="132" cy="75" rx="76" ry="48" fill="#2f6b68" opacity="0.22"/>
    <circle cx="132" cy="78" r="32" fill="#f5c26b" opacity="0.65"/>
    <rect x="280" y="26" width="360" height="38" fill="#f7e4bd" opacity="0.52"/>
    <rect x="280" y="76" width="320" height="24" fill="#f7e4bd" opacity="0.42"/>
  </g>
</svg>
