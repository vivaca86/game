<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <linearGradient id="paper" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="1" stop-color="#ead7ac"/>
    </linearGradient>
    <linearGradient id="ribbon" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#8e3e3a"/>
      <stop offset="0.55" stop-color="#bd6757"/>
      <stop offset="1" stop-color="#8e3e3a"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#2a1d14" flood-opacity="0.24"/>
    </filter>
  </defs>
  <rect width="1920" height="1080" fill="#f8efd8"/>
  <g id="combat-stage-frame" filter="url(#softShadow)">
    <rect x="230" y="205" width="1460" height="650" rx="10" fill="url(#paper)" stroke="#6a523f" stroke-width="7"/>
    <path d="M365 210 C520 5 1400 5 1555 210" fill="none" stroke="#32415a" stroke-width="20" opacity="0.5"/>
    <ellipse cx="960" cy="520" rx="495" ry="180" fill="#2f6b68" opacity="0.16"/>
    <ellipse cx="960" cy="585" rx="370" ry="120" fill="#f5c26b" opacity="0.12"/>
  </g>
  <g id="combat-title-ribbon">
