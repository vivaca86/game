<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-label="Boss stage UI component source v002">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="10" dy="14" stdDeviation="10" flood-color="#1e2a3e" flood-opacity="0.2"/>
    </filter>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
      <rect width="34" height="34" fill="#fff7e6"/>
      <path d="M0 8h34M8 0v34M25 0v34" stroke="#e8d8b0" stroke-width="1" opacity="0.24"/>
    </pattern>
  </defs>

  <rect width="1600" height="960" fill="#f2dfc6"/>
  <rect x="105" y="120" width="1390" height="620" rx="24" fill="url(#grain)" stroke="#4f382b" stroke-width="10" filter="url(#shadow)"/>
  <rect x="168" y="190" width="1264" height="442" fill="#fff1d0" opacity="0.34" stroke="#c6a65e" stroke-width="3"/>
  <ellipse cx="800" cy="392" rx="510" ry="186" fill="#3c3143" opacity="0.2"/>
  <ellipse cx="800" cy="460" rx="390" ry="120" fill="#f0c36a" opacity="0.12"/>

  <rect x="340" y="150" width="920" height="86" fill="#4d3a59" stroke="#f0c36a" stroke-width="5"/>
  <path d="M340 150 250 193l90 43Z" fill="#4d3a59" stroke="#f0c36a" stroke-width="4"/>
  <path d="M1260 150 1350 193l-90 43Z" fill="#4d3a59" stroke="#f0c36a" stroke-width="4"/>
  <text x="420" y="205" font-family="Arial" font-size="38" font-weight="700" fill="#fff5d7">boss battle ribbon</text>
  <rect x="1030" y="172" width="210" height="44" fill="#fff1d0" stroke="#c6a65e" stroke-width="3"/>

  <g fill="#f0c36a" stroke="#6d4a20" stroke-width="4">
    <circle cx="430" cy="194" r="16"/>
    <circle cx="800" cy="194" r="16"/>
    <circle cx="1170" cy="194" r="16"/>
  </g>

  <g id="route-strip">
    <rect x="440" y="250" width="720" height="120" rx="18" fill="#fff7e6" stroke="#4f382b" stroke-width="8"/>
    <rect x="475" y="270" width="650" height="24" fill="#ffe2ad" stroke="#c6a65e" stroke-width="2"/>
    <line x1="560" y1="326" x2="1040" y2="326" stroke="#c6a65e" stroke-width="8"/>
    <circle cx="1040" cy="326" r="35" fill="#ce5869" stroke="#f0c36a" stroke-width="7"/>
  </g>

  <g id="boss-command-board">
    <rect x="495" y="372" width="610" height="118" rx="18" fill="#5a4a5f" opacity="0.95" stroke="#f0c36a" stroke-width="5"/>
    <rect x="525" y="392" width="550" height="26" fill="#4d3a59" stroke="#f0c36a" stroke-width="2"/>
    <text x="545" y="412" font-family="Arial" font-size="18" font-weight="700" fill="#fff5d7">boss pressure board</text>
    <text x="740" y="412" font-family="Arial" font-size="18" font-weight="700" fill="#f5c26b">next intent chip</text>

    <g id="phase-threshold-card">
      <rect x="611" y="429" width="218" height="72" fill="#fff1d0" stroke="#f0c36a" stroke-width="3"/>
      <rect x="620" y="437" width="200" height="18" fill="#4d3a59" stroke="#f0c36a" stroke-width="1"/>
      <text x="634" y="451" font-family="Arial" font-size="13" font-weight="700" fill="#fff5d7">phase</text>
      <text x="634" y="477" font-family="Arial" font-size="20" font-weight="700" fill="#4d3a59">threshold state</text>
      <text x="634" y="498" font-family="Arial" font-size="13" font-weight="700" fill="#805845">50% 이하: next attack +3</text>
    </g>

    <g id="boss-reward-link-card">
      <rect x="971" y="429" width="218" height="72" fill="#fff1d0" stroke="#f0c36a" stroke-width="3"/>
      <rect x="980" y="437" width="200" height="18" fill="#4d3a59" stroke="#f0c36a" stroke-width="1"/>
      <text x="994" y="451" font-family="Arial" font-size="13" font-weight="700" fill="#fff5d7">clear link</text>
      <text x="994" y="477" font-family="Arial" font-size="20" font-weight="700" fill="#4d3a59">boss reward pool</text>
      <text x="994" y="498" font-family="Arial" font-size="13" font-weight="700" fill="#805845">stage clear / next route</text>
    </g>

    <g id="threshold-meter">
      <rect x="675" y="520" width="250" height="16" fill="#2f2435" opacity="0.62" stroke="#f0c36a" stroke-width="2"/>
      <rect x="675" y="520" width="142" height="16" fill="#f5c26b" opacity="0.92"/>
      <rect x="800" y="506" width="8" height="30" fill="#fff5d7" stroke="#4d3a59" stroke-width="2"/>
      <text x="663" y="562" font-family="Arial" font-size="15" font-weight="700" fill="#fff5d7">hp meter</text>
      <text x="792" y="562" font-family="Arial" font-size="15" font-weight="700" fill="#fff5d7">phase threshold pin</text>
    </g>
  </g>

  <g id="enemy-ledger">
    <rect x="1085" y="360" width="456" height="258" rx="18" fill="#4b4050" stroke="#4f382b" stroke-width="8"/>
    <rect x="1110" y="382" width="410" height="30" fill="#f0c36a" opacity="0.24" stroke="#f0c36a" stroke-width="2"/>
    <text x="1130" y="455" font-family="Arial" font-size="32" font-weight="700" fill="#fff5d7">boss name</text>
    <rect x="1118" y="488" width="196" height="42" fill="#fff8e8" opacity="0.62" stroke="#ce5869" stroke-width="3"/>
    <circle cx="1452" cy="472" r="70" fill="#4d3a59" opacity="0.8" stroke="#f0c36a" stroke-width="4"/>
    <rect x="1118" y="582" width="236" height="58" fill="#fff1d0" opacity="0.58" stroke="#f0c36a" stroke-width="3"/>
  </g>

  <g id="lowered-player-standee">
    <ellipse cx="800" cy="574" rx="75" ry="15" fill="#32415a" opacity="0.16"/>
    <circle cx="800" cy="486" r="72" fill="#fff1d0" opacity="0.28" stroke="#c6a65e" stroke-width="3"/>
    <path d="M758 575 800 438l42 137Z" fill="#5d8d86" opacity="0.65" stroke="#32415a" stroke-width="5"/>
  </g>

  <g id="player-ledger">
    <rect x="115" y="400" width="470" height="180" rx="16" fill="#fff7e6" stroke="#4f382b" stroke-width="7"/>
    <rect x="135" y="420" width="430" height="28" fill="#ffe2ad" stroke="#c6a65e" stroke-width="2"/>
    <text x="155" y="440" font-family="Arial" font-size="18" font-weight="700" fill="#805845">PLAYER</text>
    <rect x="260" y="535" width="134" height="38" fill="#fff8e8" stroke="#ce5869" stroke-width="3"/>
    <rect x="410" y="535" width="134" height="38" fill="#fff8e8" stroke="#f5c26b" stroke-width="3"/>
    <rect x="560" y="535" width="134" height="38" fill="#fff8e8" stroke="#5d8d86" stroke-width="3"/>
  </g>

  <rect x="210" y="770" width="1180" height="58" fill="#fff1d0" opacity="0.7" stroke="#c6a65e" stroke-width="3"/>
</svg>
